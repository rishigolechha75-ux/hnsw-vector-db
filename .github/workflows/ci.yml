name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vecdb:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name vecdb -p 8000:8000 vecdb:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/collections -H 'content-type: application/json' \
            -d '{"name":"t","dim":3}'
          curl -sf -X PUT localhost:8000/collections/t/points -H 'content-type: application/json' \
            -d '{"points":[{"id":"a","vector":[1,0,0]},{"id":"b","vector":[0,1,0]}]}'
          curl -sf -X POST localhost:8000/collections/t/search -H 'content-type: application/json' \
            -d '{"vector":[0.9,0.1,0],"k":1}' | grep '"id":"a"'
          docker logs vecdb
